<div class="flex flex-col gap-1" [ngClass]="{ 'text-red-500': error }">
  @if (!loading) {
    @if (label) {
      <span
        class="flex min-w-0 items-center gap-0.5 text-[11px] font-bold text-slate-500 uppercase tracking-wider"
        [ngClass]="{ 'text-red-500': error }"
      >
        <span class="truncate whitespace-nowrap">{{ label }}</span>
        @if (isRequired) {
          <span class="flex-none text-red-500">*</span>
        }
      </span>
    }

    <p-multiselect
      [ngClass]="{ 'ng-invalid ng-touched ng-dirty': error }"
      [options]="options"
      [dataKey]="dataKey"
      [optionValue]="optionValue"
      [formControl]="innerControl"
      [optionLabel]="optionLabel"
      [placeholder]="placeholder"
      (onChange)="onSelectChange($event)"
      (onBlur)="onBlur()"
      (onClear)="onClear()"
      [filter]="filter"
      [filterBy]="filterBy"
      [tabindex]="0"
      [appendTo]="appendTo"
      [overlayOptions]="overlayOptions"
      [showClear]="showClear"
      [maxSelectedLabels]="maxSelectedLabels"
      [selectedItemsLabel]="selectedItemsLabel"
    />

    @if (error && errorMessage) {
      <small class="text-xs text-red-500">{{ errorMessage }}</small>
    }
  } @else {
    <p-skeleton width="5rem" class="gap-1"></p-skeleton>
    <p-skeleton height="34px" class="w-full"></p-skeleton>
  }
</div>
