<div class="flex flex-col items-center gap-3 px-6 py-6 text-center">
  <i class="fas fa-exclamation-circle text-6xl text-amber-500"></i>
  <h5 class="text-lg font-semibold text-surface-700">{{ titulo }}</h5>
  @if (mensagem) {
    <p class="text-surface-600">{{ mensagem }}</p>
  }
  @if (submensagem) {
    <p class="text-sm text-surface-500">{{ submensagem }}</p>
  }
  <div class="mt-2 flex gap-2">
    <p-button [label]="OkText" icon="fas fa-check" severity="success" (onClick)="onconfirm()" />
    <p-button [label]="CancelText" icon="fas fa-times-circle" severity="secondary" [outlined]="true" (onClick)="onFechar()" />
  </div>
</div>
