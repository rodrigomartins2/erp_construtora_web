
<table mat-table [dataSource]="origem.dados" class="mat-elevation-z8" matSort (matSortChange)="sortData($event)">
  @for (coluna of origem.colunas; track $index) {
  <ng-container [matColumnDef]="coluna.nome">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ coluna.titulo }}</th>

      @if (coluna.tipo == 0) {
      <td mat-cell *matCellDef="let item">{{ item[coluna.nome]  }}</td>
      }

      @if (coluna.tipo == 1) {
      <td mat-cell *matCellDef="let item">
        @for (acao of origem.acoes; track $index) {
            <button mat-menu-item (click)="acao.acao(item)">
                <mat-icon>{{ acao.icone }}</mat-icon>
            </button>
            }
      </td>
      }
  </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="colunas"></tr>
  <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
</table>
  
<mat-paginator [length]="page.totalRows" [pageIndex]="page.currentPage" [pageSize]="page.pageSize"
[pageSizeOptions]="[5, 10, 20]" (page)="pageChanged($event)" showFirstLastButtons
  aria-label="Select page of users"></mat-paginator>
