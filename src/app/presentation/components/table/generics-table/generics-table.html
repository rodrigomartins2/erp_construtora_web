<app-generics-table-filter-panel
  [showHeader]="showHeader"
  [visible]="filterModalVisible"
  [isMobileViewport]="isMobileViewport"
  [activeFilterText]="activeFilterText"
  [hasActiveFilters]="hasActiveFilters"
  [filterModalTitle]="filterModalTitle"
  [filterModalSize]="filterModalSize"
  [filterDrawerHeight]="filterDrawerHeight"
  [filterTemplate]="filterTemplate"
  [filterTemplateContext]="filterTemplateContext"
  [cancelFilterButton]="cancelFilterButton"
  [clearFilterButton]="clearFilterButton"
  [applyFilterButton]="applyFilterButton"
  (visibleChange)="onFilterPanelVisibleChange($event)"
  (clearRequested)="clearFilters()"
  (applyRequested)="applyFilters()"
/>

@if (!isMobileViewport) {
  <app-generics-table-desktop-view
    [columns]="columns"
    [sortedData]="effectiveLoading ? [] : sortedData"
    [actions]="actions"
    [paginator]="paginator"
    [alwaysShowPaginator]="alwaysShowPaginator"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [loading]="effectiveLoading"
    [minWidth]="minWidth"
    [totalRecords]="totalRecordsCount"
    [lazy]="isRemotePagedMode"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    [showCurrentPageReport]="showCurrentPageReport"
    [hasActions]="hasActions"
    [emptyMessage]="emptyMessage"
    [currentPageReport]="currentPageReport"
    [isSortable]="isSortable"
    [getAlignClass]="getAlignClass"
    [getJustifyClass]="getJustifyClass"
    [getDisplayValue]="getDisplayValue"
    [getBadgeClass]="getBadgeClass"
    [getVisibleActions]="getVisibleActions"
    [isActionDisabled]="isActionDisabled"
    [getActionTooltip]="getActionTooltip"
    [runAction]="runAction"
    (sortChange)="onSort($event)"
    (pageChange)="onPageChange($event)"
  />
} @else {
  <app-generics-table-mobile-view
    [columns]="columns"
    [mobilePageData]="effectiveLoading ? [] : mobilePageData"
    [actions]="actions"
    [paginator]="paginator"
    [alwaysShowPaginator]="alwaysShowPaginator"
    [first]="first"
    [rows]="rows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [loading]="effectiveLoading"
    [showCurrentPageReport]="showCurrentPageReport"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    [sortableColumns]="sortableColumns"
    [hasActions]="hasActions"
    [emptyMessage]="emptyMessage"
    [currentPageReport]="currentPageReport"
    [totalRecords]="totalRecordsCount"
    [getDisplayValue]="getDisplayValue"
    [getBadgeClass]="getBadgeClass"
    [getVisibleActions]="getVisibleActions"
    [isActionDisabled]="isActionDisabled"
    [getActionTooltip]="getActionTooltip"
    [runAction]="runAction"
    [getCardTitle]="getCardTitle"
    (sortFieldChange)="onMobileSortFieldChange($event)"
    (sortOrderToggle)="toggleMobileSortOrder()"
    (pageChange)="onPageChange($event)"
  />
}
