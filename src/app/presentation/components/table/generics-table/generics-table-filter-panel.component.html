@if (showHeader) {
  <div class="rounded-lg border border-slate-200 bg-(--app-body-background) p-3">
    <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div class="flex flex-wrap items-center gap-2">
        <p-button
          label="Filtros"
          icon="pi pi-filter"
          [outlined]="true"
          severity="secondary"
          styleClass="!border-[#0F172A]/10 !bg-white"
          (onClick)="visibleChange.emit(true)"
        />

        <p-button
          label="Limpar filtros"
          icon="pi pi-filter-slash"
          [outlined]="true"
          severity="secondary"
          styleClass="!border-[#0F172A]/10 !bg-white"
          [disabled]="!hasActiveFilters"
          (onClick)="clearRequested.emit()"
        />
      </div>

      <span class="text-[0.7rem] font-medium text-slate-600">
        {{ activeFilterText }}
      </span>
    </div>

    @if (!isMobileViewport && visible) {
      <p-dialog
        [header]="filterModalTitle"
        [visible]="visible"
        (visibleChange)="visibleChange.emit($event)"
        [modal]="true"
        [draggable]="false"
        [resizable]="false"
        [focusTrap]="false"
        [style]="{ width: filterModalSize }"
        appendTo="body"
      >
        <ng-container *ngTemplateOutlet="filterTemplate; context: filterTemplateContext" />

        <ng-template #footer>
          <div class="flex justify-end gap-2">
            <p-button
              [label]="cancelFilterButton.label"
              [icon]="cancelFilterButton.icon"
              [text]="cancelFilterButton.text"
              [outlined]="cancelFilterButton.outlined"
              [severity]="cancelFilterButton.severity || 'secondary'"
              (onClick)="close()"
            />
            <p-button
              [label]="clearFilterButton.label"
              [icon]="clearFilterButton.icon"
              [text]="clearFilterButton.text"
              [outlined]="clearFilterButton.outlined"
              [severity]="clearFilterButton.severity || 'secondary'"
              (onClick)="clearRequested.emit()"
            />
            <p-button
              [label]="applyFilterButton.label"
              [icon]="applyFilterButton.icon"
              [text]="applyFilterButton.text"
              [outlined]="applyFilterButton.outlined"
              [severity]="applyFilterButton.severity"
              (onClick)="applyRequested.emit()"
            />
          </div>
        </ng-template>
      </p-dialog>
    } @else if (isMobileViewport && visible) {
      <!-- Custom Tailwind Bottom Sheet -->
      <div
        class="fixed inset-0 z-2000 bg-slate-900/40 transition-opacity duration-300"
        [class.opacity-100]="visible"
        [class.opacity-0]="!visible"
        (click)="close()"
      ></div>

      <div
        class="fixed bottom-0 left-0 right-0 z-2001 flex flex-col rounded-t-3xl bg-[#F5F8FC] shadow-[0_-18px_42px_rgba(15,23,42,0.22)] transition-[height,transform] duration-300 ease-out"
        [class.translate-y-0]="visible"
        [class.translate-y-full]="!visible"
        [style.height]="mobileDrawerHeight"
        [style.max-height]="'92vh'"
      >
        <div
          class="flex w-full touch-none cursor-grab items-center justify-center px-5 pb-3 pt-4 active:cursor-grabbing"
          (touchstart)="onTouchStart($event)"
          (touchmove)="onTouchMove($event)"
          (touchend)="onTouchEnd()"
        >
          <div class="h-1.5 w-12 rounded-full bg-slate-300"></div>
        </div>

        <div class="flex min-h-0 flex-1 flex-col overflow-hidden">
          <div class="min-h-0 flex-1 overflow-y-auto px-4 pb-6 pt-2">
            <div class="mb-4">
              <span class="text-lg font-bold text-slate-900">{{ filterModalTitle }}</span>
            </div>

            <ng-container *ngTemplateOutlet="filterTemplate; context: filterTemplateContext" />
          </div>

          <div
            class="sticky bottom-0 flex justify-end gap-3 border-t border-slate-100 bg-[#F5F8FC] px-5 py-4"
          >
            <p-button
              [label]="clearFilterButton.label"
              [icon]="clearFilterButton.icon"
              [text]="clearFilterButton.text"
              [outlined]="clearFilterButton.outlined ?? true"
              [severity]="clearFilterButton.severity || 'secondary'"
              (onClick)="clearRequested.emit()"
              styleClass="flex-1"
            />
            <p-button
              [label]="applyFilterButton.label"
              [icon]="applyFilterButton.icon"
              [text]="applyFilterButton.text"
              [outlined]="applyFilterButton.outlined"
              [severity]="applyFilterButton.severity"
              (onClick)="applyRequested.emit()"
              styleClass="flex-1"
            />
          </div>
        </div>
      </div>
    }
  </div>
}
