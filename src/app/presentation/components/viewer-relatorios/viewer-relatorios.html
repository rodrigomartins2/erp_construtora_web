<div class="viewer-container">
  @if (loading()) {
    <div class="flex h-[60vh] flex-col gap-3" aria-busy="true">
      <div class="flex gap-2">
        <p-skeleton width="12rem" height="2.25rem" /><p-skeleton width="8rem" height="2.25rem" />
      </div>
      <p-skeleton width="100%" height="50vh" />
    </div>
  } @else {
    @if (rawUrl()) {
      <div class="actions-bar mb-3 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <div class="page-control flex items-center gap-1.5">
            <p-button
              icon="pi pi-chevron-left"
              [rounded]="true"
              [text]="true"
              severity="secondary"
              ariaLabel="Página anterior"
              [disabled]="currentPage() <= 1"
              (onClick)="previousPage()"
            />
            <input
              type="number"
              min="1"
              [max]="totalPages()"
              [value]="currentPage()"
              class="page-input"
              aria-label="Página atual"
              (change)="onPageInput($any($event.target).value)"
              (keydown.enter)="onPageInput($any($event.target).value)"
            />
            <span class="whitespace-nowrap text-xs font-medium text-slate-500">
              Página {{ currentPage() }} de {{ totalPages() }}
            </span>
            <p-button
              icon="pi pi-chevron-right"
              [rounded]="true"
              [text]="true"
              severity="secondary"
              ariaLabel="Próxima página"
              [disabled]="currentPage() >= totalPages()"
              (onClick)="nextPage()"
            />
          </div>

          <p-button
            icon="pi pi-search-minus"
            [rounded]="true"
            [text]="true"
            severity="secondary"
            ariaLabel="Diminuir zoom"
            [disabled]="!canZoomOut()"
            (onClick)="zoomOut()"
          />
          <button
            type="button"
            class="min-w-16 rounded-md px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100"
            (click)="resetZoom()"
          >
            {{ zoomPercent() }}
          </button>
          <p-button
            icon="pi pi-search-plus"
            [rounded]="true"
            [text]="true"
            severity="secondary"
            ariaLabel="Aumentar zoom"
            [disabled]="!canZoomIn()"
            (onClick)="zoomIn()"
          />
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <p-button label="Imprimir" icon="pi pi-print" severity="info" (onClick)="printPdf()" />
          <p-button
            label="Baixar PDF"
            icon="pi pi-download"
            [outlined]="true"
            severity="secondary"
            (onClick)="downloadPdf()"
          />
          @if (excelDownload) {
            @if (downloadingExcel()) {
              <p-skeleton width="9rem" height="2.25rem" borderRadius="8px" />
            } @else {
              <p-button
                label="Baixar XLSX"
                icon="pi pi-file-excel"
                [outlined]="true"
                severity="success"
                [disabled]="downloadingExcel()"
                (onClick)="downloadExcel()"
              />
            }
          }
        </div>
      </div>

      <div
        #viewerContent
        class="viewer-content"
        (scroll)="onViewerScroll()"
        (wheel)="onViewerWheel($event)"
      >
        <canvas #pdfCanvas class="pdf-canvas" [class.opacity-0]="!canvasReady()"></canvas>
      </div>
    } @else {
      <div class="flex h-[40vh] flex-col items-center justify-center gap-3 text-red-500">
        <i class="pi pi-exclamation-triangle text-4xl"></i>
        <p class="font-medium">Erro ao carregar o arquivo PDF.</p>
      </div>
    }
  }
</div>
