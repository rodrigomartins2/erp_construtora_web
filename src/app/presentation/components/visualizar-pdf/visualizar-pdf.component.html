@if (urlSegura) {
  <div class="flex h-full flex-col gap-2">
    <div class="flex items-center justify-between gap-2">
      <span class="truncate text-sm text-surface-600">{{ nomeArquivo }}</span>
      <p-button label="Baixar" icon="fas fa-download" size="small" [outlined]="true" (onClick)="baixar()" />
    </div>
    <iframe [src]="urlSegura" [title]="nomeArquivo" class="min-h-[70vh] w-full flex-1 rounded border border-surface-200"></iframe>
  </div>
} @else {
  <div class="flex h-40 items-center justify-center text-sm text-surface-500">
    <i class="fas fa-spinner fa-spin mr-2"></i> Carregando documento...
  </div>
}
