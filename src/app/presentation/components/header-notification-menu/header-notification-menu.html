<button
  type="button"
  [class]="buttonClass"
  [attr.aria-label]="ariaLabel"
  [attr.title]="ariaLabel"
  (click)="toggle($event)"
>
  <i [class]="icon"></i>
  @if (badgeText) {
    <span
      class="absolute -top-2 -right-3 rounded-full bg-primary-600 px-1.5 py-0.5 text-[8px] font-bold leading-none text-white shadow-sm ring-2 ring-white animate-pulse"
    >
      {{ badgeText }}
    </span>
  }
  @if (hasBadge) {
    <span
      class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold leading-none text-white ring-2 ring-white"
    >
      {{ badgeLabel }}
    </span>
  }
</button>

<p-menu
  #notificationMenu
  [model]="items"
  [popup]="true"
  appendTo="body"
  [styleClass]="'header-notification-menu-panel ' + menuStyleClass"
  (click)="$event.stopPropagation()"
>
  @if (itemTemplate) {
    <ng-template #item let-item>
      <ng-container
        *ngTemplateOutlet="itemTemplate; context: { $implicit: item, item: item }"
      ></ng-container>
    </ng-template>
  }
</p-menu>
